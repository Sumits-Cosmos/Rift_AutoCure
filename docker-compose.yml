version: "3.9"

services:
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: cognitest-python-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Mount Docker socket so the service can launch test containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - cognitest-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cognitest-frontend
    ports:
      - "5173:80"
    depends_on:
      - python-service
    environment:
      - VITE_PYTHON_API_URL=http://python-service:8000
    restart: unless-stopped
    networks:
      - cognitest-net

networks:
  cognitest-net:
    driver: bridge
