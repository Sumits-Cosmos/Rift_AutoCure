version: "3.9"

services:
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: cognitest-python-service
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MIN_SLEEP=${LLM_MIN_SLEEP:-4}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Mount Docker socket so the service can launch test containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - cognitest-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_PYTHON_API_URL=/api
    container_name: cognitest-frontend
    ports:
      - "5173:80"
    depends_on:
      - python-service
    restart: unless-stopped
    networks:
      - cognitest-net

networks:
  cognitest-net:
    driver: bridge
