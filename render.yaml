# Render Blueprint — https://render.com/docs/blueprint-spec
version: 1

services:

  # ─────────────────────────────────────────────────────────────
  # 🐍 Python FastAPI Service (Healing Engine)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: cognitest-python-service
    env: python
    region: oregon
    plan: free
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: USE_DOCKER
        value: "false"
      - key: LLM_MIN_SLEEP
        value: "3"


  # ─────────────────────────────────────────────────────────────
  # 🟢 Node.js Express Backend (Orchestrator API)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: cognitest-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

    envVars:
      - key: FASTAPI_URL
        sync: false   # Set after python-service deploys
      - key: STORAGE_DIR
        value: ./storage


  # ─────────────────────────────────────────────────────────────
  # ⚛️ React + Vite Frontend (Static Site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: cognitest-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false   # Set after backend deploys
      - key: VITE_PYTHON_API_URL
        sync: false   # Set after python-service deploys
